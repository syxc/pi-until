name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'syxc/pi-until'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/joelhooks/pi-until.git main
          upstream_commit=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$upstream_commit"
          git push origin HEAD:main
